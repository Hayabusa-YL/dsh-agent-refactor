name: self-scan
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  agent-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run agent-refactor action
        uses: ./
        with:
          path: '.'
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: agent-refactor-report
          path: agent-refactor-report.html
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run gate
